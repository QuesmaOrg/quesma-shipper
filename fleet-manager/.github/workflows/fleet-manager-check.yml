# The commit gate for this module, named for the component because it will sit beside other
# components' workflows wherever this repository ends up. Inside the agent-statement monorepo the
# file is inert -- GitHub reads .github/ only at a repository root -- and the monorepo's workflow of
# the same name covers the same ground through `make check COMPONENT=fleet-manager`.
name: fleet-manager-check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make check

  # Separate from the gate on purpose: it needs the network, and a newly published advisory would
  # otherwise fail every unrelated commit. GOWORK=off inside the target grades the standard library
  # by this module's own `go` directive, which is what someone building it alone actually gets.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make vulncheck
