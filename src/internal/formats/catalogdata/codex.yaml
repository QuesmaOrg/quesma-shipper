# Codex (CLI + desktop + IDE extension, one store) — the cleanest format in the
# landscape: a uniform {timestamp, type, payload} envelope on every line, and the
# only surveyed agent that natively records the git remote.
#
# Scope is v1 row: rollout JSONL including compressed (decoded on load) and
# archived rollouts, plus the name index. Deferred to v1.1: the index databases
# (state_5 / memories_1 / goals_1) — capturing a database is enricher work.
#
# No TTL deletion of rollouts, unlike Claude Code's 30-day reaper.
spec_version: 1
family: codex
display_name: Codex

sources:
  - id: codex-rollouts
    description: >-
      Live rollouts under sessions/<YYYY>/<MM>/<DD>/ plus the flat archived_sessions/
      tree. Append-only with per-item flush; the writer repairs a truncated last
      line on reopen, which is a drift signal here and never a reason to fix a tail
      client-side. A background worker zstd-compresses rollouts older than about a
      week to .jsonl.zst, replacing the plaintext; the loader decodes them, so they
      are scrubbed and shipped as plaintext JSONL under the same session identity.
    gather: file_glob
    artifact_class: trajectory
    roots:
      - $CODEX_HOME
      - ~/.codex
    require_subdir: sessions
    # Compressed rollouts share the session cap on decoded bytes.
    max_file_bytes: 536870912
    include:
      - "sessions/**/*.jsonl"
      - "sessions/**/*.jsonl.zst"
      - "archived_sessions/**/*.jsonl"
      - "archived_sessions/**/*.jsonl.zst"
      - "session_index.jsonl"
    # One object per session, whatever form it is in: the session UUID in the file name is the
    # identity, so archiving or compressing a rollout overwrites its object rather than adding one.
    # session_index.jsonl does not match and keeps its path identity.
    identity:
      match: '(?:^|/)rollout-[^/]*-([0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12})\.jsonl(?:\.zst)?$'
      key: 'codex-session/$1'
    sniff:
      kind: jsonl
      max_scan_bytes: 65536

  - id: codex-togetherlink-rollouts
    description: Together Link desktop profile sessions, collected alongside the normal Codex store.
    gather: file_glob
    artifact_class: trajectory
    roots:
      - ~/.codex-togetherlink
    require_subdir: sessions
    max_file_bytes: 536870912
    include:
      - "sessions/**/*.jsonl"
      - "sessions/**/*.jsonl.zst"
      - "archived_sessions/**/*.jsonl"
      - "archived_sessions/**/*.jsonl.zst"
      - "session_index.jsonl"
    identity:
      match: '(?:^|/)rollout-[^/]*-([0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12})\.jsonl(?:\.zst)?$'
      key: 'codex-session/$1'
    sniff:
      kind: jsonl
      max_scan_bytes: 65536

  - id: codex-account
    description: Account and raw provider usage snapshots, uploaded when they change and at least daily.
    gather: account
    scrub: false
    roots:
      - $CODEX_HOME
      - ~/.codex
    artifact_class: context
    max_file_bytes: 8388608
    emit: account
    sniff:
      kind: jsonl
