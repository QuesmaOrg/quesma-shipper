spec_version: 1
family: hermes
display_name: Hermes
sources:
  - id: hermes-sessions
    description: Read-only session messages and per-model usage snapshots, including named profiles.
    gather: sidecar
    emit: hermes_sessions
    artifact_class: trajectory
    roots:
      - $HERMES_HOME
      - ~/.hermes
    include: ["state.db", "profiles/*/state.db"]
    max_file_bytes: 67108864
    sniff:
      kind: jsonl
