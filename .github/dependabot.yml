version: 2
updates:
  - package-ecosystem: gomod
    directory: /src
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  # Fleet Manager, the control plane: its own module, image and deployment templates. A Go
  # update also needs `make -C fleet-manager licenses`, which fleet-manager-check enforces.
  - package-ecosystem: gomod
    directory: /fleet-manager
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      fleet-manager-go-deps:
        patterns: ["*"]
  # The wire contract: its own module, which the two components above build against in place.
  - package-ecosystem: gomod
    directory: /shipper-protocol
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      shipper-protocol-go-deps:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /fleet-manager
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directory: /fleet-manager/terraform/aws
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directory: /fleet-manager/terraform/gcp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
