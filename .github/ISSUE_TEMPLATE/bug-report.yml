name: Bug report
description: The shipper or Fleet Manager does something wrong
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Shipper
        - Fleet Manager (the control plane)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `quesma-shipper --version`, or of `fleet-manager` run with no arguments and the provider it runs on (aws, gcp or azure).
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and agent
      description: For example "macOS 15.1, Claude Code" or "Ubuntu 24.04, Cursor". For Fleet Manager, where it runs, for example "ECS Express Mode from the AWS template".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: What you did, what happened, what you expected. Use synthetic data only. Do not paste trajectories, logs with real content, credentials, or presigned URLs.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `quesma-shipper doctor`
      description: Shipper issues only. Remove hostnames or paths you do not want public.
