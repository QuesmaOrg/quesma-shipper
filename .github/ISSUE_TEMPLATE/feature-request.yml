name: Feature request
description: Propose a change to what the shipper collects, scrubs, or how it runs
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Say which CONSTITUTION.md article it touches, if any.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: What can the shipper or the control plane do after this change that it cannot do today? Write "none" if none.
