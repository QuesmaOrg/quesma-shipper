# Releases for the trajectory shipper: every push to main that touches the shipper publishes one
# through TUF in R2.
#
# VERSION is the reviewed release line. The script appends <commit-count>.<hash>, keeping builds
# within that line ordered and carrying provenance that buildinfo verifies before trusting.

name: trajectory-shipper-release

on:
  push:
    branches: [main]
    # Narrower than CI's filter on purpose: a docs-only commit should not make
    # every enrolled machine download a byte-identical-in-behavior new shipper.
    paths:
      - "src/**"
      - "scripts/release-version.sh"
      - "VERSION"
      - "Makefile"
      - ".github/workflows/trajectory-shipper-release.yml"
  schedule:
    # Refresh short-lived TUF metadata even when no shipper release was published.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      recover_expired_repository:
        description: "Allow one refresh to recover already-expired metadata"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute the release version
        id: version
        run: echo "value=$(sh scripts/release-version.sh)" >> "$GITHUB_OUTPUT"

  build:
    if: github.event_name == 'push'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The version IS the history: rev-list --count needs all of it.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Build the platform matrix
        run: make dist RELEASE_VERSION=${{ needs.version.outputs.value }}

      - name: Create the release manifest
        run: |
          jq -n \
            --arg version "${{ needs.version.outputs.value }}" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              version: $version,
              published_at: $published_at,
              targets: {
                "linux/amd64": "quesma-shipper-linux-amd64",
                "linux/arm64": "quesma-shipper-linux-arm64",
                "darwin/amd64": "quesma-shipper-darwin-amd64",
                "darwin/arm64": "quesma-shipper-darwin-arm64",
                "windows/amd64": "quesma-shipper-windows-amd64.exe",
                "windows/arm64": "quesma-shipper-windows-arm64.exe",
                "darwin/pkg": "Shipper-macos-universal.pkg"
              }
            }' > bin/dist/release.json

      - uses: actions/upload-artifact@v7
        with:
          name: shipper-release-binaries
          path: |
            bin/dist/quesma-shipper-linux-*
            bin/dist/quesma-shipper-windows-*
            bin/dist/release.json
          compression-level: 0
          retention-days: 7

  build-macos:
    if: github.event_name == 'push'
    needs: version
    runs-on: macos-15
    timeout-minutes: 30
    environment:
      name: tuf-publishing-testing
      deployment: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - uses: apple-actions/import-codesign-certs@v7
        id: application-certificate
        with:
          p12-file-base64: ${{ secrets.MACOS_APPLICATION_CERT_P12_B64 }}
          p12-password: ${{ secrets.MACOS_APPLICATION_CERT_P12_PASSWORD }}

      - uses: apple-actions/import-codesign-certs@v7
        with:
          keychain: signing_temp
          create-keychain: false
          keychain-password: ${{ steps.application-certificate.outputs.keychain-password }}
          p12-file-base64: ${{ secrets.MACOS_INSTALLER_CERT_P12_B64 }}
          p12-password: ${{ secrets.MACOS_INSTALLER_CERT_P12_PASSWORD }}

      - name: Build and notarize the macOS release
        env:
          APPLE_NOTARY_ID: ${{ vars.APPLE_NOTARY_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ vars.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          MACOS_APPLICATION_IDENTITY: "Developer ID Application: Quesma Poland Sp. z o.o. (66ZNG89HN6)"
          MACOS_INSTALLER_IDENTITY: "Developer ID Installer: Quesma Poland Sp. z o.o. (66ZNG89HN6)"
        run: |
          make macos-pkg RELEASE_VERSION="${{ needs.version.outputs.value }}"
          src/packaging/macos/pkg/notarize.sh bin/dist

      - uses: actions/upload-artifact@v7
        with:
          name: shipper-release-macos
          path: |
            bin/dist/Shipper-macos-universal.pkg
            bin/dist/quesma-shipper-darwin-amd64
            bin/dist/quesma-shipper-darwin-arm64
          compression-level: 0
          retention-days: 7

  check-tuf-root:
    name: Check offline TUF root expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Enforce the 30-day renewal window
        run: |
          roots=src/packaging/common/roots
          [[ -d "$roots" ]] || { echo '::error::Commit the offline-signed roots/1.root.json before merging'; exit 1; }
          root=$(find "$roots" -name '*.root.json' -print | sort -V | tail -1)
          [[ -f "$root" ]] || { echo '::error::Commit the offline-signed roots/1.root.json before merging'; exit 1; }
          expires=$(jq -er '.signed.expires | strings' "$root")
          expiry=$(date -d "$expires" +%s)
          remaining=$(( expiry - $(date +%s) ))
          (( remaining >= 2592000 )) || { echo '::error::TUF root expires within 30 days; perform the offline renewal ceremony'; exit 1; }

  publish-tuf:
    name: ${{ github.event_name == 'push' && 'Publish release to TUF/R2' || github.event_name == 'workflow_dispatch' && 'Recover TUF metadata' || 'Refresh TUF metadata' }}
    needs: [build, build-macos, check-tuf-root]
    # A scheduled run skips build; every non-skipped prerequisite must still succeed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Serialize only R2 publication, so a release awaiting approval cannot block refreshes.
    concurrency:
      group: tuf-publication
      cancel-in-progress: false
    permissions:
      contents: read
    environment:
      name: tuf-publishing-testing
      deployment: false
    steps:
      - uses: actions/checkout@v7

      - name: Install tuftool
        run: rustup update stable && cargo install tuftool --version 0.17.0 --locked

      - uses: actions/download-artifact@v8
        if: github.event_name == 'push'
        with:
          pattern: shipper-release-*
          path: artifacts
          merge-multiple: true

      - name: Download current TUF metadata
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT }}
          AWS_REGION: auto
          R2_URI: ${{ vars.R2_URI }}
        run: |
          mkdir -p .tuf/metadata artifacts
          aws s3 sync "${R2_URI%/}/metadata/" .tuf/metadata/ --no-progress

      - name: Sign TUF metadata
        env:
          TUF_SIGNING_KEY_B64: ${{ secrets.TUF_SIGNING_KEY_B64 }}
          ADD_TARGETS: ${{ github.event_name == 'push' }}
          RECOVER_EXPIRED_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_expired_repository }}
        run: |
          umask 077
          key="$RUNNER_TEMP/tuf-operational.pem"
          echo "::add-mask::$key"
          trap 'rm -f "$key"' EXIT
          install -m 0600 /dev/null "$key"
          printf '%s' "$TUF_SIGNING_KEY_B64" | base64 --decode > "$key"
          [[ -s "$key" ]] || { echo '::error::Decoded TUF signing key is empty'; exit 1; }

          version=$(date +%s)
          targets_expires=$(date -u -d '+90 days' +%Y-%m-%dT%H:%M:%SZ)
          snapshot_expires=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)
          timestamp_expires=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)
          root=$(find .tuf/metadata -name '*.root.json' -print | sort -V | tail -1)
          targets=()
          recovery=()
          [[ "$ADD_TARGETS" != true ]] || targets=(--add-targets artifacts)
          [[ "$RECOVER_EXPIRED_REPOSITORY" != true ]] || recovery=(--allow-expired-repo)

          if [[ -z "$root" ]]; then
            root=src/packaging/common/roots/1.root.json
            tuftool create --root "$root" --key "$key" "${targets[@]}" \
              --targets-expires "$targets_expires" --targets-version "$version" \
              --snapshot-expires "$snapshot_expires" --snapshot-version "$version" \
              --timestamp-expires "$timestamp_expires" --timestamp-version "$version" --outdir .tuf
          else
            tuftool update --root "$root" --key "$key" "${targets[@]}" "${recovery[@]}" \
              --metadata-url "file://$PWD/.tuf/metadata/" \
              --targets-expires "$targets_expires" --targets-version "$version" \
              --snapshot-expires "$snapshot_expires" --snapshot-version "$version" \
              --timestamp-expires "$timestamp_expires" --timestamp-version "$version" --outdir .tuf
          fi

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT }}
          AWS_REGION: auto
          R2_URI: ${{ vars.R2_URI }}
        run: |
          if [[ -d .tuf/targets ]]; then
            aws s3 sync .tuf/targets/ "${R2_URI%/}/targets/" --no-progress
          fi
          aws s3 sync .tuf/metadata/ "${R2_URI%/}/metadata/" --exclude timestamp.json --no-progress
          aws s3 cp .tuf/metadata/timestamp.json "${R2_URI%/}/metadata/timestamp.json" --no-progress
