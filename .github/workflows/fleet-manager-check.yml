# The commit gate for fleet-manager/, the control plane. Its own workflow rather than a job in
# quesma-shipper.yml: the two components share a repository and nothing else -- separate Go
# modules, Makefiles and release lines -- so a failure here names the component it belongs to.
name: fleet-manager-check

on:
  push:
    branches: [main]
    paths:
      - "fleet-manager/**"
      - "shipper-protocol/**"
      - ".github/workflows/fleet-manager-check.yml"
  # Required checks must be reported for every PR. Filtering the entire workflow
  # leaves unmatched PRs permanently waiting for statuses that can never arrive.
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: fleet-manager

jobs:
  # Not `check`: required statuses match by job name alone, and that one is the shipper's gate.
  fleet-manager-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: fleet-manager/go.mod
          cache-dependency-path: fleet-manager/go.sum
      - run: make check

  # Separate from the gate on purpose: it needs the network, and a newly published advisory would
  # otherwise fail every unrelated commit. GOWORK=off inside the target grades the standard library
  # by this module's own `go` directive, which is what someone building it alone actually gets.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: fleet-manager/go.mod
          cache-dependency-path: fleet-manager/go.sum
      - run: make vulncheck

  # The image is otherwise built only when main publishes it, after merge. Its context spans
  # fleet-manager/ and shipper-protocol/, so a change to either can break it without a test failing.
  fleet-manager-image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: make image
