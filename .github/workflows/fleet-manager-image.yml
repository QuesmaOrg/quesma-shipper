# Publishes the fleet-manager image to Docker Hub on every push to main that touches the module,
# through the same target a person runs: `make -C fleet-manager deploy`. That target builds
# linux/amd64 -- the only architecture all three deployment targets accept -- and pushes :<sha>
# and :latest, or does nothing when the commit is already there. The templates under
# fleet-manager/terraform deploy `:latest` unless told otherwise.
name: fleet-manager-image

on:
  push:
    branches: [main]
    paths:
      - "fleet-manager/**"
      - ".github/workflows/fleet-manager-image.yml"

# Queue, never cancel: two jobs racing would decide `latest` by finish order, not commit order.
concurrency:
  group: fleet-manager-image
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: fleet-manager

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its reviewers approve each push of `latest`; the Docker Hub secrets live there, not in the repo.
    environment: fleet-manager-publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: fleet-manager/go.mod
          cache-dependency-path: fleet-manager/go.sum

      # `latest` is what a fresh apply of the templates deploys, so it is gated on the same checks
      # a pull request gets.
      - name: Gate on the module's own checks
        run: make check

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: make deploy
