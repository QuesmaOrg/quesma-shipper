name: trajectory-shipper

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "VERSION"
      - "Makefile"
      - ".github/workflows/trajectory-shipper.yml"
  # Required checks must be reported for every PR. Filtering the entire workflow
  # leaves unmatched PRs permanently waiting for statuses that can never arrive.
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - run: make check
      - run: make tidy
      - run: make build

  perf-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHIPPER_PERF_RESULTS: ${{ github.workspace }}/perf-results.ndjson
      SHIPPER_PERF_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Compile while pulling the pinned test images
        run: |
          docker pull -q minio/minio:RELEASE.2025-04-22T22-12-26Z & minio=$!
          docker pull -q ghcr.io/shopify/toxiproxy:2.12.0 & toxiproxy=$!
          (cd src && go test -tags perf -c -o /dev/null ./perf/)
          wait $minio
          wait $toxiproxy
      - name: Run performance smoke tests
        run: make perf-smoke
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-smoke-results
          path: perf-results.ndjson
          if-no-files-found: warn
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --system core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - run: go test ./...
        working-directory: src
      - name: Build and exercise the per-user installer
        shell: pwsh
        run: |
          $version = (sh scripts/release-version.sh).Trim()
          if ($LASTEXITCODE -ne 0) { throw "could not compute release version" }
          New-Item -ItemType Directory -Force bin/dist | Out-Null
          Push-Location src
          go build -trimpath -ldflags "-X github.com/QuesmaOrg/quesma-shipper/internal/platform.releaseVersion=$version" `
            -o ../bin/dist/quesma-shipper-windows-amd64.exe ./cmd/quesma-shipper
          Pop-Location
          src/packaging/windows/build-setup.ps1 -ReleaseVersion $version -Architecture amd64 `
            -BinaryPath bin/dist/quesma-shipper-windows-amd64.exe -OutputDir bin/dist
          & bin/dist/QuesmaShipperSetup-amd64.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG="$env:RUNNER_TEMP\quesma-setup.log"
          if ($LASTEXITCODE -ne 0) { throw "installer exited $LASTEXITCODE" }
          schtasks /Query /TN "\Quesma Shipper" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "scheduled task was not installed" }
          & "$env:LOCALAPPDATA\Programs\Quesma Shipper\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "uninstaller exited $LASTEXITCODE" }
          schtasks /Query /TN "\Quesma Shipper" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "scheduled task survived uninstall" }

  macos-package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Build and inspect the rootless package
        run: |
          version="$(sh scripts/release-version.sh)"
          make macos-pkg RELEASE_VERSION="$version"
          pkgutil --payload-files bin/dist/quesma-shipper-macos-universal.pkg | grep -q 'Applications/Quesma Shipper.app/Contents/MacOS/quesma-shipper'
          pkgutil --payload-files bin/dist/quesma-shipper-macos-universal.pkg | grep -q '.local/bin/quesma-shipper'
          # Rename bridge: the package must still satisfy the updater of every pre-rename install.
          (cd src && QUESMA_SHIPPER_PKG="$PWD/../bin/dist/quesma-shipper-macos-universal.pkg" \
            QUESMA_SHIPPER_RELEASE_VERSION="$version" go test ./packaging/macos/ -run BuiltPackage -v)
